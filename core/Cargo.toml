[package]
name = "devcore"
version = "0.1.0"
edition = "2021"

[lib]
name = "devcore"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# تحقق من أحدث إصدار متوافق قبل البناء (cargo update -p uniffi)
uniffi = "0.29"
thiserror = "1"
ropey = "1.6"          # بديل مبدئي؛ يُستبدل بـ zed-sum-tree عند الحاجة
portable-pty = "0.9"
